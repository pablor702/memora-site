<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memora</title>
<meta name="description" content="Recordatorios y cumpleaños que suenan a tiempo, sin internet. Para Android.">
<style>
  :root { --bg: #f4f4fb; --text: #1b1c26; --muted: #4f5163; --accent: #5b4fb3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161826; --text: #ececf4; --muted: #b3b4c6; --accent: #b9b1f3; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  svg { display: block; margin-bottom: 16px; }
  h1 { font-size: 2.2rem; margin: 0 0 8px; }
  p { margin: 0 0 16px; }
  .bajada { font-size: 1.2rem; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<!-- The logo of the launcher icon (app/src/main/res/drawable/ic_launcher_foreground.xml), cropped to its 66 dp circle. -->
<svg width="72" height="72" viewBox="21 21 66 66" aria-hidden="true">
  <circle cx="54" cy="54" r="33" fill="#161826"/>
  <circle cx="54" cy="54" r="22" fill="none" stroke="#9184D9" stroke-width="3"/>
  <circle cx="71.1" cy="36.9" r="10" fill="url(#brillo)"/>
  <circle cx="71.1" cy="36.9" r="5.7" fill="#D2CEFD"/>
  <defs>
    <radialGradient id="brillo">
      <stop offset="0.5" stop-color="#D2CEFD" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#D2CEFD" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
<h1>Memora</h1>
<p class="bajada">Que nada importante se te pase.</p>
<p>Memora es una app de recordatorios para Android: avisos que suenan a la hora exacta, cumpleaños y aniversarios que no se olvidan, y una copia opcional en tu propio Google Drive. Funciona sin internet, sin cuentas y sin publicidad.</p>
<p><a href="privacidad">Política de privacidad</a></p>
</main>
</body>
</html>
